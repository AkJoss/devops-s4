name: CI - Unit Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore dependencies
        run: dotnet restore ./exploring-actions/ExploringActions.sln

      - name: Build the solution
        run: dotnet build ./exploring-actions/ExploringActions.sln --configuration Release --no-restore

      - name: Run unit tests with report
        run: >
          dotnet test ./exploring-actions/TestExploringActions/TestExploringActions.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=TestResults.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ./exploring-actions/TestExploringActions/TestResults/TestResults.trx
